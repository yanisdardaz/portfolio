name: QR Sentinel — tests

on:
  push:
    paths: ["quishing/**", ".github/workflows/quishing-tests.yml"]
  pull_request:
    paths: ["quishing/**", ".github/workflows/quishing-tests.yml"]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      - name: Tests Python (moteur, redirections, TLS, RDAP, réputation, API)
        run: python -m pytest -q quishing/backend/tests
      - name: Tests JavaScript (moteur)
        run: node --test quishing/tests/js/*.test.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Playwright
        working-directory: quishing
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Tests de bout en bout (navigateur)
        working-directory: quishing
        run: node tests/e2e/run.js
